name: Actualizar estadísticas de DistroWatch

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: distrowatch-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Consultar DistroWatch
        run: node scripts/update-distrowatch.js

      - name: Guardar cambios
        run: |
          if git diff --quiet -- data/distrowatch.json; then
            echo "Sin cambios en las estadísticas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/distrowatch.json
          git commit -m "chore: actualizar estadísticas de DistroWatch"
          git pull --rebase --autostash
          git push
